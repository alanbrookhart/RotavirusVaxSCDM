name: Build and deploy Shinylive site

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.R'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::shinylive

      - name: Run model regression tests
        run: Rscript tests/test-model.R

      - name: Export Shinylive site
        run: Rscript -e 'shinylive::export("app", "_site"); file.create("_site/.nojekyll")'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
